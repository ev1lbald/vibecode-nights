[project]
name = "vibecode-nights-pitch-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langfuse>=3.10,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic-settings>=2.8,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.22,<1",
    "python-pptx>=1.0,<2",
    "typing-extensions>=4.12,<5",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
